{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h4 class="text-center mb-4">إعادة تعيين كلمة المرور</h4>

                <p>أدخل بريدك الإلكتروني لاستقبال رابط إعادة التعيين.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.email.label_tag }}
                    {{ form.email }}
                    <button type="submit" class="btn btn-primary mt-3">إرسال</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
