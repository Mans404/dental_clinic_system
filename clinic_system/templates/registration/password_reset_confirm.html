{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h4 class="text-center mb-4">اختيار كلمة مرور جديدة</h4>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">حفظ كلمة المرور الجديدة</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
