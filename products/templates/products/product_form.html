{% extends "base.html" %}

{% block content %}
<h2>{% if product %}تعديل المنتج{% else %}إضافة منتج جديد{% endif %}</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">اسم المنتج</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ product.name|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">الكمية</label>
        <input type="number" name="quantity" id="quantity" class="form-control" min="0"
            value="{{ product.quantity|default:0 }}" required>
    </div>
    <div class="mb-3">
        <label for="price" class="form-label">السعر</label>
        <input type="text" name="price" id="price" class="form-control" value="{{ product.price|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label for="wholesale_price" class="form-label">سعر الجملة (لكل وحدة)</label>
        <input type="text" name="wholesale_price" id="wholesale_price" class="form-control"
            value="{{ tier_prices.wholesale|default:'' }}">
        <div class="form-text">سيتم حساب "سعر الجملة للكمية" و"سعر الكمية" تلقائياً بضرب السعر في الكمية.</div>
    </div>
    <button type="submit" class="btn btn-success">حفظ</button>
    <a href="{% url 'products:product_list' %}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
