{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>🧾 الفواتير</h3>
    <a href="{% url 'invoices:invoice_create' %}" class="btn btn-success">
        + إنشاء فاتورة
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-striped align-middle text-center">
            <thead class="table-primary">
                <tr>
                    <th>رقم الفاتورة</th>
                    <th>التاريخ</th>
                    <th>الإجمالي</th>
                    <th>عرض</th>
                </tr>
            </thead>
            <tbody>
                {% for invoice in invoices %}
                <tr>
                    <td>#{{ invoice.id }}</td>
                    <td>{{ invoice.created_at|date:"Y-m-d H:i" }}</td>
                    <td>{{ invoice.total }} جنيه</td>
                    <td>
                        <a href="{% url 'invoices:invoice_detail' invoice.id %}" class="btn btn-sm btn-outline-primary">
                            عرض
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">لا توجد فواتير</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
